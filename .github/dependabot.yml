version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "*"
        # The minAppVersion contract is enforced by scripts/check-api-floor.mjs,
        # which typechecks src/ against the typings matching manifest.json's
        # floor rather than whatever is installed. So bumping these types is
        # safe on its own: the check fails only when the code actually uses an
        # API newer than the floor, which is when the decision is real.
        # obsidian still gets its own PR so an API move stays visible.
        exclude-patterns:
          - "obsidian"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
