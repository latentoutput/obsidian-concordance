version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "*"
        # The minAppVersion contract is enforced by scripts/check-api-floor.mjs,
        # which typechecks src/ against the typings matching manifest.json's
        # floor rather than whatever is installed. So bumping these types is
        # safe on its own: the check fails only when the code actually uses an
        # API newer than the floor, which is when the decision is real.
        # obsidian still gets its own PR so an API move stays visible.
        #
        # typescript is excluded for a different reason: typescript-eslint pins
        # a peer range (currently >=4.8.4 <6.1.0), so a TypeScript major lands
        # ahead of its support and breaks `npm ci` outright. Inside the group
        # that one failure blocks every unrelated devDependency update in the
        # same PR. On its own it just sits red until typescript-eslint widens
        # the range, and then it merges.
        exclude-patterns:
          - "obsidian"
          - "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
