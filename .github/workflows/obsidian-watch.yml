name: Obsidian API floor check

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the declared API floor
        id: check
        run: |
          # eslint-plugin-obsidianmd's no-unsupported-api covers member-level
          # drift on every PR, so the weekly run only needs the compile against
          # freshly downloaded floor typings. That is the part that can start
          # failing without anyone touching this repo.
          set +e
          node scripts/check-api-floor.mjs > /tmp/floor-check.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/floor-check.txt
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TITLE="src no longer compiles against the declared minAppVersion floor"

          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open issue with this title already exists; skipping."
            exit 0
          fi

          {
            echo "The Obsidian API floor check failed. Output:"
            echo
            echo '```'
            cat /tmp/floor-check.txt
            echo '```'
            echo
            echo "See \`scripts/check-api-floor.mjs\`. Either avoid the newer API or raise \`minAppVersion\`."
          } > /tmp/issue-body.md

          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
