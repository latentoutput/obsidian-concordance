name: Obsidian API floor check

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the declared API floor
        id: check
        run: |
          set +e
          {
            node scripts/check-min-app-version.mjs
            IMPORTS=$?
            echo ""
            node scripts/check-api-floor.mjs
            FLOOR=$?
          } > /tmp/floor-check.txt 2>&1
          set -e
          cat /tmp/floor-check.txt
          STATUS=0
          if [ "$IMPORTS" -ne 0 ] || [ "$FLOOR" -ne 0 ]; then STATUS=1; fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          STATUS="${{ steps.check.outputs.status }}"
          if [ "$STATUS" = "1" ]; then
            TITLE="minAppVersion is below the honest floor for current imports"
          else
            TITLE="Obsidian API floor check: unknown symbols in source"
          fi

          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open issue with this title already exists; skipping."
            exit 0
          fi

          {
            echo "The Obsidian API floor check failed. Output:"
            echo
            echo '```'
            cat /tmp/floor-check.txt
            echo '```'
            echo
            echo "See \`scripts/check-min-app-version.mjs\` and \`scripts/obsidian-api-versions.json\`."
          } > /tmp/issue-body.md

          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
